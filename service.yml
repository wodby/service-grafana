name: grafana
title: Grafana
icon: grafana
type: service
scalable: false

labels:
- grafana
- monitoring
- visualization

options:
- version: '13.2'
  tag: '13.2.1'
  default: true

endpoints:
- name: grafana
  ports:
  - name: http
    number: 3000
    protocol: http
    main: true

tokens:
- name: admin_username
  value: admin
- name: admin_password
  generate:
    regex: '[A-Za-z0-9!@#%_-]{32}'

env:
- name: GF_SECURITY_ADMIN_USER
  value: '{{admin_username}}'
  secret: true
- name: GF_SECURITY_ADMIN_PASSWORD
  value: '{{admin_password}}'
  secret: true
- name: GF_SERVER_ROOT_URL
  value: '{{service.url}}'
- name: GF_ANALYTICS_REPORTING_ENABLED
  value: 'false'
- name: GF_ANALYTICS_CHECK_FOR_UPDATES
  value: 'false'

links:
- name: loki
  title: Grafana Loki
  selectors:
  - type: service
    labels:
    - loki

volumes:
- name: data
  title: Grafana data
  size: 10
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.existingClaim
      value: '{{volumes.data.claim}}'
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'

configs:
- name: datasources
  title: Grafana datasources
  configContent: |
    apiVersion: 1
    prune: true
    datasources: []
  processTokens: true
  filepath: /etc/grafana/provisioning/datasources/wodby.yml

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateful
  chart: oci://registry-1.docker.io/wodby/stateful
  version: 0.2.0
  valueMappings:
    replicas: replicaCount
    nameOverride: nameOverride
    fullnameOverride: fullnameOverride
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
    strategy: updateStrategy.type
    minReady: minReadySeconds
    shutdownGracePeriod: terminationGracePeriodSeconds
  values:
  - name: containerName
    value: grafana
  - name: containerPorts
    value:
    - name: http
      containerPort: 3000
      protocol: TCP
  - name: headlessService.enabled
    value: false
  - name: persistence.mountPath
    value: /var/lib/grafana
  - name: podSecurityContext
    value:
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
  - name: startupProbe
    value:
      httpGet:
        path: /api/health
        port: http
      failureThreshold: 30
      periodSeconds: 5
  - name: readinessProbe
    value:
      httpGet:
        path: /api/health
        port: http
      periodSeconds: 10
  - name: livenessProbe
    value:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: grafana
    image: grafana/grafana
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
